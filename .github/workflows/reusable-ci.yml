name: Reusable CI

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      language:
        required: false
        type: string
        default: "typescript"
      runs_db:
        required: false
        type: boolean
        default: false
      runs_redis:
        required: false
        type: boolean
        default: false
      db_schema:
        required: false
        type: string
        default: ""
      test_command:
        required: false
        type: string
        default: ""
      install_hurl:
        required: false
        type: boolean
        default: false
      is_frontend:
        required: false
        type: boolean
        default: false
      build_tool:
        required: false
        type: string
        default: "gradle"


env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://root:rootpassword@127.0.0.1:5432/crm_database
      REDIS_URL: redis://127.0.0.1:6379
      DB_SCHEMA: schema_${{ inputs.component }}
      NODE_ENV: test
      CIMA_GITHUB_TOKEN: ${{ secrets.CIMA_GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Gitleaks analiza el rango completo del PR, que puede empezar antes
          # del padre de HEAD tras un force-push. Se requiere todo el historial.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── TypeScript Setup ──────────────────────────────────────
      - name: Setup pnpm
        if: inputs.language == 'typescript'
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        if: inputs.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ── Java Setup ────────────────────────────────────────────
      - name: Setup Java
        if: inputs.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: ${{ inputs.build_tool }}

      # ── Install Dependencies ──────────────────────────────────
      - name: Install dependencies (TypeScript)
        if: inputs.language == 'typescript'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (Java Gradle)
        if: inputs.language == 'java' && inputs.build_tool == 'gradle'
        run: ./gradlew dependencies --no-daemon

      - name: Install dependencies (Java Maven)
        if: inputs.language == 'java' && inputs.build_tool == 'maven'
        run: chmod +x mvnw && ./mvnw dependency:resolve --no-transfer-progress

      # ── Database & Cache Services (Conditional) ───────────────
      - name: Start PostgreSQL service
        if: ${{ inputs.runs_db }}
        shell: bash
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=root \
            -e POSTGRES_PASSWORD=rootpassword \
            -e POSTGRES_DB=crm_database \
            public.ecr.aws/docker/library/postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in {1..30}; do
            if docker exec postgres pg_isready -U root -d crm_database >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 1
          done

      - name: Start Redis service
        if: ${{ inputs.runs_redis }}
        shell: bash
        run: |
          docker run -d --name redis -p 6379:6379 public.ecr.aws/docker/library/redis:7-alpine --save ""
          for i in {1..30}; do
            if docker exec redis redis-cli ping >/dev/null 2>&1; then
              echo "Redis is ready"
              break
            fi
            sleep 1
          done

      # ── Hurl (contract tests) ─────────────────────────────────
      - name: Cache Hurl binary
        if: ${{ inputs.install_hurl }}
        uses: actions/cache@v4
        id: hurl-cache
        with:
          path: ~/.local/bin/hurl
          key: hurl-v7.1.0-${{ runner.os }}

      - name: Install Hurl
        if: ${{ inputs.install_hurl }}
        shell: bash
        run: |
          mkdir -p ~/.local/bin
          if [ "${{ steps.hurl-cache.outputs.cache-hit }}" != "true" ]; then
            HURL_VERSION=7.1.0
            curl -sSL -o /tmp/hurl.tar.gz "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            tar -xzf /tmp/hurl.tar.gz -C /tmp
            if [ -f "/tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin/hurl" ]; then
              mv "/tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/bin/hurl" ~/.local/bin/hurl
            elif [ -f "/tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/hurl" ]; then
              mv "/tmp/hurl-${HURL_VERSION}-x86_64-unknown-linux-gnu/hurl" ~/.local/bin/hurl
            else
              find /tmp -name hurl -type f -exec mv {} ~/.local/bin/hurl \;
            fi
            chmod +x ~/.local/bin/hurl
            rm -rf /tmp/hurl*
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # ── Test Environment Setup (Autonomous Contract) ─────────
      - name: Setup test environment
        shell: bash
        run: |
          if [ -f "scripts/setup-test-env.mjs" ]; then
            node scripts/setup-test-env.mjs
          elif [ -f "scripts/setup-test-env.sh" ]; then
            bash scripts/setup-test-env.sh
          elif [ -f ".env.test" ]; then
            cp .env.test .env
          elif [ -f ".env.test.example" ]; then
            cp .env.test.example .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          if [ "${{ inputs.runs_db }}" = "true" ] && [ ! -f ".env" ]; then
            {
              echo "DATABASE_URL=postgres://root:rootpassword@127.0.0.1:5432/crm_database"
              echo "REDIS_URL=redis://127.0.0.1:6379"
              echo "DB_SCHEMA=schema_${{ inputs.component }}"
              echo "NODE_ENV=test"
            } > .env
          fi

      # ── Lint ──────────────────────────────────────────────────
      - name: Lint (TypeScript)
        if: inputs.language == 'typescript'
        shell: bash
        run: |
          if node -e "const pkg = JSON.parse(require('fs').readFileSync('package.json', 'utf8')); process.exit(pkg.scripts && pkg.scripts.lint ? 0 : 1)" 2>/dev/null; then
            pnpm lint
          elif [ "${{ inputs.is_frontend }}" = "true" ]; then
            pnpm lint
          fi

      # ── Build ─────────────────────────────────────────────────
      - name: Build (TypeScript)
        if: inputs.language == 'typescript'
        run: pnpm build

      - name: Upload frontend build artifact
        if: ${{ inputs.is_frontend && inputs.language == 'typescript' }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 1

      - name: Build (Java Gradle)
        if: inputs.language == 'java' && inputs.build_tool == 'gradle'
        run: ./gradlew build -x test --no-daemon

      - name: Build (Java Maven)
        if: inputs.language == 'java' && inputs.build_tool == 'maven'
        run: chmod +x mvnw && ./mvnw clean package -DskipTests --no-transfer-progress

      # ── Validations ───────────────────────────────────────────
      - name: Validate gateway manifest
        if: ${{ !inputs.is_frontend && inputs.language == 'typescript' }}
        run: pnpm gateway:validate

      - name: Validate OpenAPI contract
        if: ${{ !inputs.is_frontend && inputs.language == 'typescript' }}
        run: pnpm openapi:check

      - name: Prepare schema (TypeScript)
        if: ${{ inputs.runs_db && inputs.language == 'typescript' }}
        shell: bash
        run: |
          if pnpm run | grep -q "db:migrate"; then
            pnpm db:bootstrap 2>/dev/null || true
            pnpm db:migrate
          else
            pnpm db:push
          fi

      - name: Prepare schema (Java Gradle)
        if: ${{ inputs.runs_db && inputs.language == 'java' && inputs.build_tool == 'gradle' }}
        run: ./gradlew flywayMigrate --no-daemon

      - name: Prepare schema (Java Maven)
        if: ${{ inputs.runs_db && inputs.language == 'java' && inputs.build_tool == 'maven' }}
        shell: bash
        run: |
          if grep -q "flyway" pom.xml; then
            chmod +x mvnw && ./mvnw flyway:migrate --no-transfer-progress
          else
            echo "No Flyway detected in pom.xml. Skipping schema migration step."
          fi

      # ── Tests ─────────────────────────────────────────────────
      - name: Run test suite (TypeScript)
        if: inputs.language == 'typescript'
        run: ${{ inputs.test_command || 'pnpm test:unit' }}

      - name: Run test suite (Java Gradle)
        if: inputs.language == 'java' && inputs.build_tool == 'gradle'
        run: ${{ inputs.test_command || './gradlew test --no-daemon' }}

      - name: Run test suite (Java Maven)
        if: inputs.language == 'java' && inputs.build_tool == 'maven'
        run: chmod +x mvnw && ${{ inputs.test_command || './mvnw test --no-transfer-progress' }}

