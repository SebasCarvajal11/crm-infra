name: Reusable Deploy

on:
  workflow_call:
    inputs:
      component:
        description: Production component to deploy
        required: true
        type: string
      deploy_branch:
        description: Git branch to deploy
        required: false
        default: main
        type: string
      deploy_version:
        description: Immutable commit SHA validated by CI for a component deployment
        required: false
        default: ""
        type: string
      composeFile:
        description: Custom compose file path override
        required: false
        type: string
      envFile:
        description: Custom env file path override
        required: false
        type: string
      healthCheckUrl:
        description: Custom health check URL override
        required: false
        type: string
      infra_owner:
        description: GitHub owner of the crm-infra repository
        required: false
        default: SebasCarvajal11
        type: string
    secrets:
      DEPLOY_SSH_HOST:
        required: true
      DEPLOY_SSH_PORT:
        required: true
      DEPLOY_SSH_USER:
        required: true
      DEPLOY_SSH_PRIVATE_KEY:
        required: true
      DEPLOY_BASE_DIR:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  # La plataforma, las migraciones y el corte de tráfico son compartidos.
  # Serializar cualquier componente evita carreras entre dos despliegues válidos.
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" -H "$DEPLOY_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Validate immutable deployment version
        shell: bash
        env:
          DEPLOY_VERSION: ${{ inputs.deploy_version }}
        run: |
          if [[ -n "$DEPLOY_VERSION" && ! "$DEPLOY_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deploy_version must be a full Git commit SHA." >&2
            exit 1
          fi

      - name: Bootstrap and deploy
        shell: bash
        env:
          COMPONENT: ${{ inputs.component }}
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
          DEPLOY_VERSION: ${{ inputs.deploy_version }}
          DEPLOY_BASE_DIR: ${{ secrets.DEPLOY_BASE_DIR }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          INFRA_REPOSITORY_OWNER: ${{ inputs.infra_owner }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "${DEPLOY_SSH_PORT:-22}" -o StrictHostKeyChecking=yes "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "set -euo pipefail; \
            mkdir -p '$DEPLOY_BASE_DIR'; \
            if [ ! -d '$DEPLOY_BASE_DIR/crm-infra/.git' ]; then \
              git clone 'https://github.com/$INFRA_REPOSITORY_OWNER/crm-infra.git' '$DEPLOY_BASE_DIR/crm-infra'; \
            fi; \
            git -C '$DEPLOY_BASE_DIR/crm-infra' fetch --prune origin '$DEPLOY_BRANCH'; \
            git -C '$DEPLOY_BASE_DIR/crm-infra' checkout --force -B '$DEPLOY_BRANCH' 'origin/$DEPLOY_BRANCH'; \
            export DEPLOY_BASE_DIR='$DEPLOY_BASE_DIR'; \
            export DEPLOY_BRANCH='$DEPLOY_BRANCH'; \
            export DEPLOY_VERSION='$DEPLOY_VERSION'; \
            export GITHUB_OWNER='$INFRA_REPOSITORY_OWNER'; \
            export COMPOSE_FILE_OVERRIDE='${{ inputs.composeFile }}'; \
            export ENV_FILE_OVERRIDE='${{ inputs.envFile }}'; \
            export HEALTH_CHECK_URL_OVERRIDE='${{ inputs.healthCheckUrl }}'; \
            cd '$DEPLOY_BASE_DIR/crm-infra'; \
            bash '$DEPLOY_BASE_DIR/crm-infra/deploy/remote/bootstrap-server.sh'; \
            bash '$DEPLOY_BASE_DIR/crm-infra/deploy/remote/deploy-component.sh' '$COMPONENT'"
